name: Build DTT Native Integrity Agent

# Builds dtt_agent for Windows/Linux/macOS x64+arm64 on every push/PR that
# touches the native agent, plus on demand. Uploads each binary as a build
# artifact; also attaches them to a GitHub Release when you push a tag
# like "native-v1.0.0".

on:
  push:
    branches: [ main ]
    paths:
      - 'dtt_native_agent/**'
      - '.github/workflows/build-native-agent.yml'
    tags:
      - 'native-v*'

  pull_request:
    paths:
      - 'dtt_native_agent/**'

  workflow_dispatch: {}

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false

      matrix:
        include:

          # ---------------------------------------------------------
          # Windows x64
          # ---------------------------------------------------------
          - name: windows-x64
            os: windows-latest
            arch: x64
            java_arch: x64
            output_name: dtt_agent-win-x64.dll
            build_path: build/Release/dtt_agent.dll
            cmake_extra: ""

          # ---------------------------------------------------------
          # Windows ARM64
          # ---------------------------------------------------------
          - name: windows-arm64
            os: windows-11-arm
            arch: arm64
            java_arch: aarch64
            output_name: dtt_agent-win-arm64.dll
            build_path: build/Release/dtt_agent.dll
            cmake_extra: ""

          # ---------------------------------------------------------
          # Linux x64
          # ---------------------------------------------------------
          - name: linux-x64
            os: ubuntu-latest
            arch: x64
            java_arch: x64
            output_name: libdtt_agent-linux-x64.so
            build_path: build/libdtt_agent.so
            cmake_extra: ""

          # ---------------------------------------------------------
          # Linux ARM64
          # ---------------------------------------------------------
          - name: linux-arm64
            os: ubuntu-24.04-arm
            arch: arm64
            java_arch: aarch64
            output_name: libdtt_agent-linux-arm64.so
            build_path: build/libdtt_agent.so
            cmake_extra: ""

          # ---------------------------------------------------------
          # macOS x64 / Intel
          # ---------------------------------------------------------
          - name: macos-x64
            os: macos-13
            arch: x64
            java_arch: x64
            output_name: libdtt_agent-macos-x64.dylib
            build_path: build/libdtt_agent.dylib
            cmake_extra: "-DCMAKE_OSX_ARCHITECTURES=x86_64"

          # ---------------------------------------------------------
          # macOS ARM64 / Apple Silicon
          # ---------------------------------------------------------
          - name: macos-arm64
            os: macos-14
            arch: arm64
            java_arch: aarch64
            output_name: libdtt_agent-macos-arm64.dylib
            build_path: build/libdtt_agent.dylib
            cmake_extra: "-DCMAKE_OSX_ARCHITECTURES=arm64"

    steps:

      # -----------------------------------------------------------
      # Checkout
      # -----------------------------------------------------------
      - name: Checkout
        uses: actions/checkout@v5

      # -----------------------------------------------------------
      # Java 21
      #
      # We only need the JDK headers:
      #   jni.h
      #   jvmti.h
      #
      # Java 21 is used instead of Java 17 because the current
      # Temurin metadata available to setup-java provides ARM64
      # Java 21 packages reliably.
      # -----------------------------------------------------------
      - name: Set up JDK 21 (${{ matrix.arch }})
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          architecture: ${{ matrix.java_arch }}

      # -----------------------------------------------------------
      # Show Java environment
      # -----------------------------------------------------------
      - name: Verify Java/JVM headers
        shell: bash
        run: |
          echo "JAVA_HOME=$JAVA_HOME"
          java -version
          echo "Checking JVM headers..."

          test -f "$JAVA_HOME/include/jni.h"
          test -f "$JAVA_HOME/include/jvmti.h"

          echo "jni.h found:"
          echo "$JAVA_HOME/include/jni.h"

          echo "jvmti.h found:"
          echo "$JAVA_HOME/include/jvmti.h"

      # -----------------------------------------------------------
      # Configure CMake
      # -----------------------------------------------------------
      - name: Configure (CMake)
        shell: bash
        run: |
          cmake \
            -S dtt_native_agent \
            -B build \
            -DCMAKE_BUILD_TYPE=Release \
            ${{ matrix.cmake_extra }}

      # -----------------------------------------------------------
      # Build
      # -----------------------------------------------------------
      - name: Build
        shell: bash
        run: |
          cmake --build build --config Release --parallel

      # -----------------------------------------------------------
      # Rename output to platform-specific name
      # -----------------------------------------------------------
      - name: Rename output to platform-specific name
        shell: bash
        run: |
          mkdir -p out

          cp \
            "${{ matrix.build_path }}" \
            "out/${{ matrix.output_name }}"

          echo "Built:"
          ls -lh "out/${{ matrix.output_name }}"

      # -----------------------------------------------------------
      # Upload individual artifact
      # -----------------------------------------------------------
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.output_name }}
          path: out/${{ matrix.output_name }}
          if-no-files-found: error

  # =================================================================
  # macOS UNIVERSAL
  #
  # Combines:
  #   x86_64
  #   arm64
  #
  # into one universal Mach-O dylib.
  # =================================================================
  macos-universal:
    name: macos-universal (lipo)
    needs: build
    runs-on: macos-14

    steps:

      - name: Download macOS x64 build
        uses: actions/download-artifact@v4
        with:
          name: libdtt_agent-macos-x64.dylib
          path: x64

      - name: Download macOS arm64 build
        uses: actions/download-artifact@v4
        with:
          name: libdtt_agent-macos-arm64.dylib
          path: arm64

      - name: Merge with lipo
        shell: bash
        run: |
          mkdir -p out

          lipo -create \
            x64/libdtt_agent-macos-x64.dylib \
            arm64/libdtt_agent-macos-arm64.dylib \
            -output out/libdtt_agent-macos-universal.dylib

          echo "Universal binary:"
          lipo -info out/libdtt_agent-macos-universal.dylib

          ls -lh out/libdtt_agent-macos-universal.dylib

      - name: Upload universal artifact
        uses: actions/upload-artifact@v4
        with:
          name: libdtt_agent-macos-universal.dylib
          path: out/libdtt_agent-macos-universal.dylib
          if-no-files-found: error

  # =================================================================
  # GITHUB RELEASE
  #
  # Triggered only for tags:
  #   native-v1.0.0
  #   native-v1.1.0
  #   etc.
  # =================================================================
  release:
    name: Attach binaries to release
    if: startsWith(github.ref, 'refs/tags/native-v')
    needs:
      - build
      - macos-universal

    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Flatten artifact folders
        shell: bash
        run: |
          mkdir -p release

          find artifacts \
            -type f \
            -exec cp {} release/ \;

          echo "Release files:"
          ls -lah release

      - name: Create/Update Release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
